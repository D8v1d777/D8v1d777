  <text x="49" y="164" fill="#f5f8ff" font-size="59" font-weight="800" letter-spacing="-2">I BUILD</text>
  <text x="49" y="225" fill="#f5f8ff" font-size="59" font-weight="800" letter-spacing="-2">MY OWN</text>
  <text x="49" y="286" fill="#6ddcff" font-size="59" font-weight="800" letter-spacing="-2">TOOLS.</text>
