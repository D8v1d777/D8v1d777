    <path d="M0 58H1200M0 302H1200" stroke="#dbe2ee" stroke-opacity=".16"/>
    <path d="M0 62H1200" stroke="url(#edge)" stroke-width="2" filter="url(#glow)"/>
    <g fill="none" stroke="#e5eaf2" stroke-opacity=".2">
      <circle cx="950" cy="177" r="124" stroke-dasharray="3 10"/>
      <circle cx="950" cy="177" r="94" stroke-dasharray="42 12 4 12"/>
      <circle cx="950" cy="177" r="63" stroke-opacity=".35"/>
      <path d="M784 177H1116M950 11V343"/>
      <path d="M832 59L1068 295M1068 59L832 295" stroke-opacity=".15"/>
    </g>
