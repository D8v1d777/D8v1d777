      <text x="48" y="39">D8V1D777 / FIELD NOTES</text>
      <text x="1152" y="39" text-anchor="end">INDEPENDENT SYSTEMS LAB</text>
      <text x="48" y="330">BUILD // BREAK // UNDERSTAND</text>
      <text x="1152" y="330" text-anchor="end">EST. IN CURIOSITY</text>
      <text x="950" y="181" text-anchor="middle" fill="#f1f4f8" font-size="13" letter-spacing="4">SYS_07</text>
    </g>
    <g>
      <text x="49" y="150" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="-3" fill="#f3f5f8">D8V1D777</text>
      <rect x="50" y="171" width="300" height="3" fill="#ff2448" filter="url(#glow)"/>
