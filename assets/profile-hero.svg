<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d">
<title id="t">D8V1D777 — blue eye manga-inspired profile banner</title>
<desc id="d">An original dark manga-inspired composition with an electric blue iris, white ink-like hair shapes, deep shadows, and subtle animated energy rings.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03050a"/><stop offset=".52" stop-color="#080e1c"/><stop offset="1" stop-color="#020409"/></linearGradient>
 <radialGradient id="bluehalo"><stop stop-color="#1679ff" stop-opacity=".38"/><stop offset=".32" stop-color="#0755ca" stop-opacity=".18"/><stop offset="1" stop-color="#00132c" stop-opacity="0"/></radialGradient>
 <radialGradient id="iris"><stop stop-color="#e8ffff"/><stop offset=".12" stop-color="#a4f3ff"/><stop offset=".34" stop-color="#43cfff"/><stop offset=".64" stop-color="#1477f6"/><stop offset=".88" stop-color="#12398c"/><stop offset="1" stop-color="#06142f"/></radialGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".42" stop-color="#dbe7f8"/><stop offset=".72" stop-color="#8696b4"/><stop offset="1" stop-color="#27334a"/></linearGradient>
 <linearGradient id="scan"><stop stop-color="#54e6ff" stop-opacity="0"/><stop offset=".5" stop-color="#54e6ff" stop-opacity=".7"/><stop offset="1" stop-color="#54e6ff" stop-opacity="0"/></linearGradient>
 <pattern id="halftone" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#b9c9e6" fill-opacity=".23"/></pattern>
 <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
 <clipPath id="eyeclip"><path d="M650 190 Q805 61 1032 151 Q1092 174 1127 202 Q986 308 780 251 Q700 230 650 190Z"/></clipPath>
 <clipPath id="frame"><rect width="1200" height="390" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
