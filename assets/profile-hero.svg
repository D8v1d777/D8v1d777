<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">D8V1D777 — Signal / Systems</title>
  <desc id="desc">A dark graphite engineering banner with animated crimson scan lines, a radar ring, glitch accents, and a high-contrast typographic mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090c"/><stop offset=".53" stop-color="#111319"/><stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2448" stop-opacity="0"/><stop offset=".22" stop-color="#ff2448"/><stop offset=".77" stop-color="#e8edf5" stop-opacity=".7"/><stop offset="1" stop-color="#e8edf5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
