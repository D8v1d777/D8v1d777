      <text x="50" y="244" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8992a2">Build things that hold up under scrutiny.</text>
      <g font-family="monospace" font-size="10" letter-spacing="1.6" fill="#ff667f">
